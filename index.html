<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小小守護者：淨灘英雄大作戰</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>小小守護者：淨灘英雄大作戰</h1>
  <div id="game">
    <p>拖曳垃圾到正確的垃圾桶！</p>
    <div id="trash-items"></div>
    <div id="bins">
      <div class="bin" data-type="plastic">塑膠</div>
      <div class="bin" data-type="paper">紙類</div>
      <div class="bin" data-type="general">一般垃圾</div>
    </div>
    <div id="scoreboard">分數：<span id="score">0</span></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
